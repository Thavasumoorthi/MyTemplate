name: Flask PyTest CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  qa:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 2
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
            python -m pip install pytest pytest-cov ruff bandit playwright pytest-playwright
            python -m playwright install --with-deps chromium

      - name: Start Flask application
        run: |
          nohup python manage.py server > app.log 2>&1 &

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl -f http://127.0.0.1:5000/; then
              echo "Application is ready"
              exit 0
            fi
            echo "Waiting for application..."
            sleep 2
          done

          echo "Application failed to start"
          cat app.log
          exit 1

      - name: Run QA pipeline
        run: make qa

      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports-python-${{ matrix.python-version }}
          path: |
            reports/
            coverage_report/
            app.log